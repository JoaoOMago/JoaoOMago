<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site - Teste</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 600px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #7f5af0, #2cb67d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.1rem;
      color: #b0b0c0;
      margin-bottom: 1.5rem;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(127, 90, 240, 0.15);
      border: 1px solid #7f5af0;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #a78bfa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Funcionou!</h1>
    <p>Este é o site de teste publicado com GitHub Pages, servido a partir da pasta <strong>site</strong>.</p>
    <span class="badge">index.html carregado com sucesso</span>
  </div>
</body>
</html>
