<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ds-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1018"/>
      <stop offset="50%" stop-color="#121b27"/>
      <stop offset="100%" stop-color="#080c12"/>
    </linearGradient>
    <linearGradient id="ds-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#66c0f4"/>
      <stop offset="100%" stop-color="#1b2838"/>
    </linearGradient>
    <linearGradient id="ds-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a4d007"/>
      <stop offset="100%" stop-color="#57cbde"/>
    </linearGradient>
    <filter id="ds-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#ds-bg)"/>

  <!-- Dashboard Grid Representation -->
  <g opacity="0.2" stroke="#66c0f4" stroke-width="1">
    <line x1="60" y1="60" x2="740" y2="60"/>
    <line x1="60" y1="160" x2="740" y2="160"/>
    <line x1="60" y1="260" x2="740" y2="260"/>
    <line x1="60" y1="360" x2="740" y2="360"/>
    <line x1="160" y1="60" x2="160" y2="390"/>
    <line x1="320" y1="60" x2="320" y2="390"/>
    <line x1="480" y1="60" x2="480" y2="390"/>
    <line x1="640" y1="60" x2="640" y2="390"/>
  </g>

  <!-- Area Chart Wave Form -->
  <path d="M 60 360 Q 180 220 300 290 T 540 180 T 740 240 L 740 380 L 60 380 Z" fill="url(#ds-cyan)" opacity="0.45"/>
  <path d="M 60 360 Q 180 220 300 290 T 540 180 T 740 240" fill="none" stroke="#66c0f4" stroke-width="4" filter="url(#ds-glow)"/>

  <!-- Metrics Node Points -->
  <circle cx="300" cy="290" r="6" fill="#a4d007" filter="url(#ds-glow)"/>
  <circle cx="540" cy="180" r="7" fill="#57cbde" filter="url(#ds-glow)"/>
  <circle cx="740" cy="240" r="6" fill="#66c0f4" filter="url(#ds-glow)"/>

  <!-- Bar Visualizer Elements -->
  <g fill="#2a475e" opacity="0.8">
    <rect x="80" y="220" width="22" height="140" rx="3"/>
    <rect x="110" y="190" width="22" height="170" rx="3"/>
    <rect x="140" y="150" width="22" height="210" rx="3" fill="#66c0f4" opacity="0.9"/>
    <rect x="170" y="240" width="22" height="120" rx="3"/>
  </g>

  <!-- Title & Typography -->
  <text x="400" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3" filter="url(#ds-glow)">
    DATASPHERE
  </text>
  <text x="400" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#a4d007" text-anchor="middle" letter-spacing="5">
    REALTIME METRIC ENGINE
  </text>

  <!-- Status Tag -->
  <rect x="30" y="30" width="100" height="26" rx="4" fill="#a4d007" opacity="0.9"/>
  <text x="80" y="48" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0e141b" text-anchor="middle" letter-spacing="1">
    ANALYTICS
  </text>
</svg>
