<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="synth-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="50%" stop-color="#2c164d"/>
      <stop offset="100%" stop-color="#0f071a"/>
    </linearGradient>
    <linearGradient id="synth-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5c158"/>
      <stop offset="50%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#9b59b6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#synth-bg)"/>

  <!-- Oscilloscope Waveform -->
  <path d="M 50 250 Q 150 100 250 250 T 450 250 T 650 250 L 750 250" fill="none" stroke="url(#synth-wave)" stroke-width="5"/>
  <path d="M 50 250 Q 150 140 250 250 T 450 250 T 650 250 L 750 250" fill="none" stroke="#e5c158" stroke-width="2" opacity="0.6"/>

  <!-- Knobs & Sliders Representation -->
  <g transform="translate(150, 310)">
    <circle cx="50" cy="50" r="30" fill="#201335" stroke="#9b59b6" stroke-width="3"/>
    <line x1="50" y1="50" x2="65" y2="30" stroke="#e5c158" stroke-width="4"/>
    
    <circle cx="160" cy="50" r="30" fill="#201335" stroke="#9b59b6" stroke-width="3"/>
    <line x1="160" y1="50" x2="175" y2="30" stroke="#e5c158" stroke-width="4"/>

    <circle cx="270" cy="50" r="30" fill="#201335" stroke="#9b59b6" stroke-width="3"/>
    <line x1="270" y1="50" x2="285" y2="30" stroke="#e5c158" stroke-width="4"/>

    <circle cx="380" cy="50" r="30" fill="#201335" stroke="#9b59b6" stroke-width="3"/>
    <line x1="380" y1="50" x2="395" y2="30" stroke="#e5c158" stroke-width="4"/>

    <circle cx="490" cy="50" r="30" fill="#201335" stroke="#9b59b6" stroke-width="3"/>
    <line x1="490" y1="50" x2="505" y2="30" stroke="#e5c158" stroke-width="4"/>
  </g>

  <!-- Title & Typography -->
  <text x="400" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    RETRO SYNTH
  </text>
  <text x="400" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#e5c158" text-anchor="middle" letter-spacing="5">
    POLYPHONIC AUDIO ENGINE
  </text>

  <!-- Tag -->
  <rect x="30" y="30" width="120" height="26" rx="4" fill="#9b59b6" opacity="0.9"/>
  <text x="90" y="48" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    WEB AUDIO
  </text>
</svg>
